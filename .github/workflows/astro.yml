name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main # Or your default branch name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write # Required for the Cloudflare action

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.SUDOKUPLAYS_CLOUDFLARE_PAGE }}
          accountId: ${{ secrets.SUDOKUPLAYS_CLOUDFLARE_ACC_ID }}
          projectName: 'sudokuplays-site' # Must match the project name you create in Cloudflare
          directory: 'dist' # Astro's default output folder
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
